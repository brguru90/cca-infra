# Static checks only - no cluster access, no secrets, no self-hosted runner
# needed. Runs on GitHub-hosted runners deliberately: this is where
# third-party actions are fine to use more freely, since there's no
# cluster-admin kubeconfig or Docker socket at stake here.

name: CCA Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [app, platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.2"

      - name: terraform fmt -check
        run: terraform -chdir=terraform/${{ matrix.root }} fmt -check -recursive

      - name: terraform init (no backend, no cluster)
        run: terraform -chdir=terraform/${{ matrix.root }} init -backend=false

      - name: terraform validate
        run: terraform -chdir=terraform/${{ matrix.root }} validate

  dockerfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/backend/Dockerfile

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/admin-frontend/Dockerfile

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck scripts/*.sh

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
