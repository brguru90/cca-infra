# Ad-hoc, read-only cluster introspection - not part of the deploy/rollback/
# platform pipelines. Exists so a stuck rollout (Deployment never reaching
# Ready, PVC never Bound, etc.) can be diagnosed by inspecting live pods/
# events/logs without re-running an entire build+deploy cycle just to see
# what's wrong. Takes no cluster-mutating action.

name: CCA Debug

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Namespace to inspect
        required: true
        default: cca-integration
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, linux]
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      NAMESPACE: ${{ inputs.namespace }}
      TF_DATA_DIR: /srv/cca/tfdata/${{ inputs.namespace == 'cca-integration' && 'integration' || (inputs.namespace == 'cca-uat' && 'uat' || 'production') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform state (read-only - no init/apply)
        run: |
          set +e
          ENVIRONMENT="${NAMESPACE#cca-}"
          echo "=== state file on disk ==="
          ls -la "/srv/cca/state/${ENVIRONMENT}/" 2>&1
          echo "=== state file backups (scripts/backup-state.sh keeps the last 20) ==="
          ls -la "/srv/cca/state/${ENVIRONMENT}/backups/" 2>&1
          echo "=== terraform state list (integration app root) ==="
          terraform -chdir=terraform/app init -reconfigure -input=false -backend=true -lock=false \
            -backend-config="path=/srv/cca/state/${ENVIRONMENT}/terraform.tfstate" 2>&1
          terraform -chdir=terraform/app state list 2>&1
          exit 0

      - name: Cluster state
        run: |
          echo "=== pods (-o wide) ==="
          kubectl get pods -n "$NAMESPACE" -o wide || true
          echo "=== deployments ==="
          kubectl get deployments -n "$NAMESPACE" -o wide || true
          echo "=== pvc ==="
          kubectl get pvc -n "$NAMESPACE" || true
          echo "=== pv ==="
          kubectl get pv || true
          echo "=== storageclasses ==="
          kubectl get storageclass || true
          echo "=== configmaps ==="
          kubectl get configmaps -n "$NAMESPACE" || true
          echo "=== events (most recent last) ==="
          kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp || true

      - name: NodePort connectivity (health-check.sh hits these over IPv4 loopback)
        # IPv6 loopback ([::1]) is deliberately NOT checked here - confirmed
        # live that kube-proxy on this K3s setup never binds NodePorts to
        # it, RequireDualStack notwithstanding (see health-check.sh's
        # check_once() comment). Testing it here would just reproduce a
        # permanent, known false-negative, not surface anything new.
        run: |
          set +e
          echo "=== services ==="
          kubectl get svc -n "$NAMESPACE" -o wide
          backend_port="$(kubectl get svc backend -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null)"
          admin_port="$(kubectl get svc admin-frontend -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null)"
          echo "backend nodePort=${backend_port:-<none>} admin nodePort=${admin_port:-<none>}"
          if [[ -n "$backend_port" ]]; then
            echo "=== curl backend NodePort (127.0.0.1:${backend_port}/api/health_check) ==="
            curl -v --max-time 5 "http://127.0.0.1:${backend_port}/api/health_check" 2>&1
          fi
          if [[ -n "$admin_port" ]]; then
            echo "=== curl admin NodePort (127.0.0.1:${admin_port}/) ==="
            curl -v --max-time 5 "http://127.0.0.1:${admin_port}/" 2>&1
          fi
          mongo_port="$(kubectl get svc cca-mongodb-external -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null)"
          if [[ -n "$mongo_port" ]]; then
            # Mongo doesn't speak HTTP, so this will fail at the protocol
            # level regardless - the useful signal is purely whether curl
            # gets as far as "Connected to" (TCP-level reachability) before
            # the inevitable protocol error, same diagnostic use as every
            # other curl check in this file.
            echo "=== curl mongo NodePort (127.0.0.1:${mongo_port}) - only the TCP connect matters here ==="
            curl -v --max-time 5 "http://127.0.0.1:${mongo_port}/" 2>&1 | head -10
          fi
          headlamp_port="$(kubectl get svc headlamp -n "$NAMESPACE" -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null)"
          if [[ -n "$headlamp_port" ]]; then
            echo "=== curl headlamp NodePort (127.0.0.1:${headlamp_port}/) ==="
            curl -v --max-time 5 "http://127.0.0.1:${headlamp_port}/" 2>&1
          fi
          echo "=== iptables nat KUBE-NODEPORTS chain (IPv4) ==="
          sudo iptables -t nat -L KUBE-NODEPORTS -n 2>&1 || echo "chain not found (kube-proxy in ipvs mode, or not yet programmed)"
          echo "=== ip6tables nat KUBE-NODEPORTS chain (IPv6) ==="
          sudo ip6tables -t nat -L KUBE-NODEPORTS -n 2>&1 || echo "chain not found"
          echo "=== node's real global IPv6 address(es) ==="
          ip -6 addr show scope global
          echo "=== backend Service spec (ipFamilies/clusterIPs) ==="
          kubectl get svc backend -n "$NAMESPACE" -o jsonpath='{.spec.ipFamilies}{"\n"}{.spec.clusterIPs}{"\n"}{.spec.ipFamilyPolicy}{"\n"}' 2>/dev/null
          echo "=== admin-frontend Service spec (ipFamilies/clusterIPs) ==="
          kubectl get svc admin-frontend -n "$NAMESPACE" -o jsonpath='{.spec.ipFamilies}{"\n"}{.spec.clusterIPs}{"\n"}{.spec.ipFamilyPolicy}{"\n"}' 2>/dev/null
          echo "=== backend pod IPs (status.podIPs - both families if dual-stack CNI actually assigned both) ==="
          kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=backend -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.status.podIPs}{"\n"}{end}' 2>/dev/null
          echo "=== admin-frontend pod IPs (status.podIPs) ==="
          kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=admin-frontend -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.status.podIPs}{"\n"}{end}' 2>/dev/null
          echo "=== backend EndpointSlices ==="
          kubectl get endpointslices -n "$NAMESPACE" -l kubernetes.io/service-name=backend -o wide 2>/dev/null
          echo "=== admin-frontend EndpointSlices ==="
          kubectl get endpointslices -n "$NAMESPACE" -l kubernetes.io/service-name=admin-frontend -o wide 2>/dev/null
          real_ipv6="$(ip -6 addr show scope global | awk '/inet6/{print $2}' | cut -d/ -f1 | head -n1)"
          if [[ -n "$real_ipv6" ]]; then
            if [[ -n "$backend_port" ]]; then
              echo "=== curl backend over real IPv6 ([${real_ipv6}]:${backend_port}) ==="
              curl -6 -v --max-time 5 "http://[${real_ipv6}]:${backend_port}/api/health_check" 2>&1
            fi
            if [[ -n "$admin_port" ]]; then
              echo "=== curl admin-frontend over real IPv6 ([${real_ipv6}]:${admin_port}) ==="
              curl -6 -v --max-time 5 "http://[${real_ipv6}]:${admin_port}/" 2>&1
            fi
          else
            echo "no global-scope IPv6 address found on this host"
          fi
          echo "=== k3s service status ==="
          sudo systemctl status k3s --no-pager 2>&1 | head -20
          exit 0

      - name: Describe and log every non-ready or ever-restarted pod
        run: |
          set +e
          for pod in $(kubectl get pods -n "$NAMESPACE" --no-headers 2>/dev/null | awk '{
            split($2,r,"/");
            # $4 is the restart count (e.g. "150" or "150 (6m27s ago)" -
            # whitespace-splitting still isolates just the number here).
            # A pod can be crash-looping and currently back up (Running,
            # Ready) between crashes - restart count catches that even when
            # the Running/Ready check alone would skip it.
            if ($3!="Running" || r[1]!=r[2] || $4+0 > 0) print $1
          }'); do
            echo "--- describe $pod ---"
            kubectl describe pod "$pod" -n "$NAMESPACE"
            echo "--- logs $pod (all containers, last 200 lines) ---"
            kubectl logs "$pod" -n "$NAMESPACE" --all-containers --tail=200
            echo "--- previous logs $pod (if it restarted) ---"
            kubectl logs "$pod" -n "$NAMESPACE" --all-containers --previous --tail=200 2>/dev/null
          done
          exit 0
