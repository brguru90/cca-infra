# Applies terraform/platform - the MongoDB Community Operator and
# Loki/Alloy/Grafana observability stack - once, cluster-wide. Must succeed
# at least once BEFORE the very first terraform/app apply for any
# environment: terraform/app/mongodb.tf's kubernetes_manifest resource
# validates against the MongoDBCommunity CRD at plan time, which only
# exists once this workflow has installed the operator.
#
# Re-running this workflow after the first time is safe (Terraform's usual
# idempotency) and is how you bump chart versions in
# terraform/platform/variables.tf.

name: CCA Platform

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cca-platform
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux]
    environment: platform
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply platform secrets
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: ./scripts/apply-secrets.sh platform

      - name: Host diagnostics
        run: |
          echo "=== disk ==="
          df -h
          echo "=== memory ==="
          free -h
          echo "=== inodes ==="
          df -i
          echo "=== connectivity: github.com (control) ==="
          curl -sS -o /dev/null -w 'dns:%{time_namelookup}s connect:%{time_connect}s tls:%{time_appconnect}s ttfb:%{time_starttransfer}s total:%{time_total}s http:%{http_code}\n' --max-time 15 https://github.com || echo "FAILED"
          echo "=== connectivity: release-assets.githubusercontent.com (the CDN failing chart downloads) ==="
          curl -sS -o /dev/null -w 'dns:%{time_namelookup}s connect:%{time_connect}s tls:%{time_appconnect}s ttfb:%{time_starttransfer}s total:%{time_total}s http:%{http_code}\n' --max-time 15 https://release-assets.githubusercontent.com || echo "FAILED"
          echo "=== same, forced IPv4 ==="
          curl -4 -sS -o /dev/null -w 'dns:%{time_namelookup}s connect:%{time_connect}s tls:%{time_appconnect}s ttfb:%{time_starttransfer}s total:%{time_total}s http:%{http_code}\n' --max-time 15 https://release-assets.githubusercontent.com || echo "FAILED (ipv4)"
          echo "=== same, forced IPv6 ==="
          curl -6 -sS -o /dev/null -w 'dns:%{time_namelookup}s connect:%{time_connect}s tls:%{time_appconnect}s ttfb:%{time_starttransfer}s total:%{time_total}s http:%{http_code}\n' --max-time 15 https://release-assets.githubusercontent.com || echo "FAILED (ipv6)"
          echo "=== DNS resolution ==="
          getent hosts release-assets.githubusercontent.com || echo "resolution failed"

      - name: Work around broken IPv6 route to the GitHub release-asset CDN
        # Diagnostics (previous step) proved this precisely: `curl -6` to
        # release-assets.githubusercontent.com fails instantly (connect
        # time 0.000000s - not slow, just refused/unreachable), while `-4`
        # and default both succeed in ~0.2s. That hostname is what backs the
        # actual chart .tgz downloads for the mongodb/loki/grafana Helm
        # repos (they publish via GitHub Releases). Terraform's embedded
        # Helm SDK apparently doesn't fall back to IPv4 fast enough for the
        # real per-asset download (it hung 2 minutes before erroring on a
        # single, uncontended fetch - ruling out the -parallelism=1 fix
        # below as the real cure, though it's kept since it's harmless).
        #
        # Pinning this ONE hostname to its working IPv4 address in
        # /etc/hosts is resolver-implementation-agnostic (glibc AND Go's
        # pure-Go resolver both consult /etc/hosts first, unconditionally)
        # and doesn't touch the box's real IPv6 config - K3s's own
        # dual-stack pod networking and public app serving are untouched.
        # The IP is re-resolved fresh each run rather than hardcoded, since
        # GitHub's CDN IPs rotate.
        run: |
          set -euo pipefail
          ipv4_addr="$(getent ahostsv4 release-assets.githubusercontent.com | awk '{print $1; exit}')"
          if [[ -z "$ipv4_addr" ]]; then
            echo "::error::could not resolve an IPv4 address for release-assets.githubusercontent.com - cannot apply the workaround"
            exit 1
          fi
          echo "Pinning release-assets.githubusercontent.com -> ${ipv4_addr} in /etc/hosts"
          sed -i '/release-assets\.githubusercontent\.com/d' /etc/hosts
          echo "${ipv4_addr} release-assets.githubusercontent.com" >> /etc/hosts
          getent hosts release-assets.githubusercontent.com

      - name: Terraform apply
        # -parallelism=1 alone did NOT fix the timeouts (see the previous
        # step's comment for the real root cause) - kept anyway since
        # serializing chart downloads is harmless and mildly friendlier to
        # this home connection regardless.
        run: |
          set -euo pipefail
          export TF_DATA_DIR="/srv/cca/tfdata/platform"
          terraform -chdir=terraform/platform init -reconfigure -lock-timeout=5m \
            -backend-config="path=/srv/cca/state/platform/terraform.tfstate"
          terraform -chdir=terraform/platform apply -auto-approve -lock-timeout=5m -parallelism=1 2>&1 | tee /srv/cca/tfdata/platform-apply-debug.log

      - name: Show captured apply log and cluster state (always, even on failure)
        if: always()
        run: |
          echo "=== last 200 lines of persisted apply log ==="
          tail -n 200 /srv/cca/tfdata/platform-apply-debug.log || echo "log file not found"
          echo "=== disk (main filesystems only) ==="
          df -h / /home
          echo "=== cca-monitoring pods ==="
          kubectl get pods -n cca-monitoring -o wide || true
          echo "=== cca-monitoring pvc ==="
          kubectl get pvc -n cca-monitoring || true
          echo "=== cca-monitoring events (most recent last) ==="
          kubectl get events -n cca-monitoring --sort-by=.lastTimestamp || true
          echo "=== describe any non-Running/non-Ready pod ==="
          for pod in $(kubectl get pods -n cca-monitoring --no-headers 2>/dev/null | awk '$3!="Running" || $2!~/^([0-9]+)\/\1$/{print $1}'); do
            echo "--- describe $pod ---"
            kubectl describe pod "$pod" -n cca-monitoring || true
            echo "--- logs $pod (all containers, last 100 lines) ---"
            kubectl logs "$pod" -n cca-monitoring --all-containers --tail=100 || true
          done

      - name: Verify Metrics Server and MongoDBCommunity CRD
        run: |
          set -euo pipefail
          kubectl get apiservice v1beta1.metrics.k8s.io -o jsonpath='{.status.conditions[?(@.type=="Available")].status}{"\n"}'
          kubectl get crd mongodbcommunity.mongodbcommunity.mongodb.com
          echo "Grafana: $(terraform -chdir=terraform/platform output -raw grafana_url 2>/dev/null || echo 'see terraform output grafana_url')"
