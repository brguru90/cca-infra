# Deploy/rollback pipeline. Runs entirely on the self-hosted runner on the
# home server (outbound-only connection to GitHub - no inbound SSH, no
# exposed Kubernetes API, see IMPLEMENTATION_PLAN.md). Third-party actions
# are kept to a minimum and pinned to commit SHAs: this runner holds
# cluster-admin kubeconfig access and the Docker socket, so a compromised
# marketplace action here is a much bigger blast radius than on a
# GitHub-hosted runner.
#
# Two ways to trigger this:
#   - workflow_dispatch: manual, from the Actions tab. Any action/environment.
#   - repository_dispatch (event_type: app-push): fired by a small workflow
#     in cca_backend/cca_frontend/cca_admin_frontend on push to their main
#     branch (see IMPLEMENTATION_PLAN.md Sec 15). ALWAYS resolves to
#     action=deploy, environment=integration, region=asia-india, regardless
#     of client_payload contents - uat/production are never auto-deployed.
#
# `inputs.*` is only populated for workflow_dispatch runs - every job below
# reads action/environment/region from `needs.prepare.outputs.*` instead,
# which `prepare` resolves once with an `inputs.x || '<default>'` fallback so
# both trigger types produce the same values downstream.
#
# Job graph:
#   prepare -> build-backend  \
#           -> build-admin     >-> deploy-terraform -> record-release
#           -> build-flutter  /        (needs prepare + backend + admin only -
#                                        a Gradle flake must never block an
#                                        API deploy; flutter runs in parallel
#                                        and record-release picks up whatever
#                                        artifacts exist)
#
# For `action: rollback` (workflow_dispatch only - repository_dispatch never
# resolves to rollback), build-backend/build-admin/build-flutter are all
# skipped - prepare resolves the target version's image tags from its
# recorded manifest.json instead of building anything new.

name: CCA Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Action
        required: true
        type: choice
        options: [deploy, rollback]
      environment:
        description: Environment
        required: true
        type: choice
        options: [integration, uat, production]
      region:
        description: Region
        required: true
        default: asia-india
        type: choice
        options: [asia-india]
      version:
        description: Exact version to roll back to (required for action=rollback, e.g. v2026.08.26.143015-production-r184). Ignored for action=deploy.
        required: false
        type: string
      skip_flutter:
        description: Skip the Flutter APK build (deploy only - backend/admin still deploy normally)
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [app-push]

permissions:
  contents: write
  packages: write

concurrency:
  # Shared with ops.yml's group string on purpose - serializes deploys and
  # day-2 ops (stop/restart/scale) against the same environment. Falls back
  # to asia-india/integration for repository_dispatch runs, where
  # inputs.region/inputs.environment are unset - matching what a manual
  # environment=integration run resolves to, so both trigger types
  # correctly serialize against each other instead of racing.
  group: cca-${{ inputs.region || 'asia-india' }}-${{ inputs.environment || 'integration' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, linux]
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      environment: ${{ steps.resolve.outputs.environment }}
      region: ${{ steps.resolve.outputs.region }}
      version: ${{ steps.resolve.outputs.version }}
      namespace: ${{ steps.resolve.outputs.namespace }}
      backend_port: ${{ steps.resolve.outputs.backend_port }}
      admin_port: ${{ steps.resolve.outputs.admin_port }}
      backend_image: ${{ steps.resolve.outputs.backend_image }}
      admin_image: ${{ steps.resolve.outputs.admin_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false # CI always builds each app repo's own `main`, never the pinned submodule SHA - see IMPLEMENTATION_PLAN.md

      - name: Resolve action/environment/region, version, ports, and image tags
        id: resolve
        env:
          # repository_dispatch runs never populate `inputs` at all - these
          # fallbacks are what makes an app-repo push behave exactly like a
          # manual `action=deploy, environment=integration` run.
          ACTION: ${{ inputs.action || 'deploy' }}
          ENVIRONMENT: ${{ inputs.environment || 'integration' }}
          REGION: ${{ inputs.region || 'asia-india' }}
          ROLLBACK_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "action=${ACTION}" >> "$GITHUB_OUTPUT"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "region=${REGION}" >> "$GITHUB_OUTPUT"

          case "$ENVIRONMENT" in
            integration) BACKEND_PORT=3211; ADMIN_PORT=3202 ;;
            uat)         BACKEND_PORT=3311; ADMIN_PORT=3302 ;;
            production)  BACKEND_PORT=3411; ADMIN_PORT=3402 ;;
          esac
          echo "namespace=cca-${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "backend_port=${BACKEND_PORT}" >> "$GITHUB_OUTPUT"
          echo "admin_port=${ADMIN_PORT}" >> "$GITHUB_OUTPUT"

          if [[ "$ACTION" == "deploy" ]]; then
            VERSION="v$(date -u +'%Y.%m.%d.%H%M%S')-${ENVIRONMENT}-r${GITHUB_RUN_NUMBER}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "backend_image=ghcr.io/brguru90/cca-backend:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "admin_image=ghcr.io/brguru90/cca-admin-frontend:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "$ROLLBACK_VERSION" ]]; then
              echo "::error::action=rollback requires the 'version' input"
              exit 1
            fi
            manifest="/srv/cca/releases/${ROLLBACK_VERSION}/manifest.json"
            if [[ ! -f "$manifest" ]]; then
              echo "::error::no manifest found for version ${ROLLBACK_VERSION} at ${manifest}"
              ls /srv/cca/releases || true
              exit 1
            fi
            manifest_env="$(jq -r .environment "$manifest")"
            if [[ "$manifest_env" != "$ENVIRONMENT" ]]; then
              echo "::error::version ${ROLLBACK_VERSION} belongs to environment '${manifest_env}', not '${ENVIRONMENT}'"
              exit 1
            fi
            BACKEND_IMAGE="$(jq -r .backend_image "$manifest")"
            ADMIN_IMAGE="$(jq -r .admin_image "$manifest")"

            # Fail before touching the cluster if either image no longer
            # resolves (e.g. GHCR retention deleted it).
            docker manifest inspect "$BACKEND_IMAGE" >/dev/null
            docker manifest inspect "$ADMIN_IMAGE" >/dev/null

            echo "version=${ROLLBACK_VERSION}" >> "$GITHUB_OUTPUT"
            echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
            echo "admin_image=${ADMIN_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    needs: prepare
    if: needs.prepare.outputs.action == 'deploy'
    runs-on: [self-hosted, linux]
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brguru90/cca_backend
          ref: main
          path: sources/cca_backend
          fetch-depth: 0

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push backend image
        run: |
          set -euo pipefail
          docker build \
            --build-arg "APP_VERSION=${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.backend_image }}" \
            --tag "ghcr.io/brguru90/cca-backend:${{ needs.prepare.outputs.environment }}-latest" \
            --file docker/backend/Dockerfile \
            sources/cca_backend
          docker push "${{ needs.prepare.outputs.backend_image }}"
          docker push "ghcr.io/brguru90/cca-backend:${{ needs.prepare.outputs.environment }}-latest"

      - name: Import image into K3s containerd (bypass registry pull on this single-node cluster)
        # The runner and the K3s node are the SAME host on this project (see
        # IMPLEMENTATION_PLAN.md) - there is no reason for the Deployment's
        # Pod to re-fetch over the network an image that was just built right
        # here. This also sidesteps a real GHCR quirk hit on the first live
        # deploys: a brand-new tag's anonymous-pull ACL can take 10-20+
        # minutes to propagate after its first push, during which kubelet's
        # pull gets a flat 403 from ghcr.io's token endpoint (not a network
        # failure - a real, if temporary, authorization decision) and the
        # Deployment never reaches Ready within any sane rollout timeout.
        # `docker save | k3s ctr images import` loads the exact same tagged
        # reference straight into containerd's local content store, so the
        # kubelet's `image_pull_policy = "IfNotPresent"` (see backend_api.tf/
        # backend_cron.tf) finds it locally and never calls out to ghcr.io at
        # all for this environment's rollout. The registry push above is
        # kept regardless, for provenance and for the day this becomes a
        # multi-node cluster (see storage.tf's identical single-node caveat).
        run: |
          set -euo pipefail
          docker save \
            "${{ needs.prepare.outputs.backend_image }}" \
            "ghcr.io/brguru90/cca-backend:${{ needs.prepare.outputs.environment }}-latest" \
            | k3s ctr images import -

  build-admin:
    needs: prepare
    if: needs.prepare.outputs.action == 'deploy'
    runs-on: [self-hosted, linux]
    environment: ${{ needs.prepare.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brguru90/cca_admin_frontend
          ref: main
          path: sources/cca_admin_frontend
          fetch-depth: 0

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push admin-frontend image
        run: |
          set -euo pipefail
          docker build \
            --tag "${{ needs.prepare.outputs.admin_image }}" \
            --tag "ghcr.io/brguru90/cca-admin-frontend:${{ needs.prepare.outputs.environment }}-latest" \
            --file docker/admin-frontend/Dockerfile \
            sources/cca_admin_frontend
          docker push "${{ needs.prepare.outputs.admin_image }}"
          docker push "ghcr.io/brguru90/cca-admin-frontend:${{ needs.prepare.outputs.environment }}-latest"

      - name: Import image into K3s containerd (bypass registry pull on this single-node cluster)
        # See the identical step in build-backend for why - same root cause,
        # same fix, same single-host assumption.
        run: |
          set -euo pipefail
          docker save \
            "${{ needs.prepare.outputs.admin_image }}" \
            "ghcr.io/brguru90/cca-admin-frontend:${{ needs.prepare.outputs.environment }}-latest" \
            | k3s ctr images import -

  build-flutter:
    needs: prepare
    if: needs.prepare.outputs.action == 'deploy' && !inputs.skip_flutter
    runs-on: [self-hosted, linux]
    environment: ${{ needs.prepare.outputs.environment }}
    env:
      # Installed by bootstrap-host.yml's "Install Android SDK" step -
      # AGP/Gradle looks for the SDK at this path via these exact variable
      # names (ANDROID_HOME is the older/still-widely-checked alias).
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_HOME: /opt/android-sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brguru90/cca_frontend
          ref: main
          path: sources/cca_frontend
          fetch-depth: 0

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "11" # AGP 7.2.0 (this repo's android/build.gradle) breaks on JDK 17+

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.7.12" # pubspec.yaml's `sdk: ">=2.16.1 <3.0.0"` rules out any Flutter shipping Dart 3
          channel: stable
          cache: true

      - name: Trust the cached Flutter SDK's git checkout
        # Real bug, caught live: git flags the SDK checkout this action
        # caches under _work/_tool/flutter/... as "dubious ownership" (its
        # files predate the runner service running as root, or were laid
        # down by a different process UID). Flutter's own tooling shells
        # out to `git describe` on its SDK checkout to report its version;
        # with that git command failing, it silently falls back to
        # "0.0.0-unknown" - which then fails flutter_windowmanager's
        # `sdk: >=1.10.0` constraint during `flutter pub get`, well before
        # any of this project's own code is even touched.
        # `*`, not one specific path: this runner already has root,
        # cluster-admin kubeconfig, and the Docker socket (see this repo's
        # own "third-party actions pinned to SHAs" paranoia elsewhere) -
        # trusting every git directory it happens to touch is not a
        # meaningfully bigger blast radius than what it already has.
        run: git config --global --add safe.directory '*'

      - name: Configure Android signing
        working-directory: sources/cca_frontend/android
        run: |
          set -euo pipefail
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" && -n "${{ secrets.ANDROID_KEY_PROPERTIES }}" ]]; then
            printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
            printf '%s\n' "${{ secrets.ANDROID_KEY_PROPERTIES }}" > key.properties
            echo "Signing: using CI-managed keystore from secrets."
          else
            echo "::warning title=Compromised signing key::ANDROID_KEYSTORE_BASE64/ANDROID_KEY_PROPERTIES are not set - building with the keystore committed to cca_frontend (android/app/keystore.jks). That key and its passwords are public. Do not distribute this APK beyond testing until a real keystore is configured."
          fi

      - name: Compose env-ci.json (overrides the dead ccavijayapura.com domain)
        id: fenv
        working-directory: sources/cca_frontend
        run: |
          set -euo pipefail
          APP_ID="$(openssl rand -hex 16)"
          APP_SECRET="$(openssl rand -hex 16)"
          echo "::add-mask::${APP_SECRET}"

          # env-prod.json points at the now-dead ccavijayapura.com. On
          # Flutter 3.7.12, a CLI --dart-define does NOT override a
          # same-named key already set via --dart-define-from-file (that
          # override-order fix shipped in Flutter 3.13 - flutter/flutter#130604,
          # #131088) - so we compose one merged file instead of layering flags.
          jq -S --arg host "travel-planner.ddns.net" \
                --arg port "${{ needs.prepare.outputs.backend_port }}" \
                --arg proto "http" \
                --arg id "$APP_ID" \
                --arg secret "$APP_SECRET" \
            '. + {SERVER_HOST:$host, SERVER_PORT:$port, SERVER_PROTOCOL:$proto, APP_ID:$id, APP_SECRET:$secret}
             | with_entries(.value |= tostring)' \
            env-prod.json > env-ci.json

          test "$(jq -r .SERVER_HOST env-ci.json)" = "travel-planner.ddns.net"

      - name: flutter build apk --release
        working-directory: sources/cca_frontend
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --dart-define-from-file=env-ci.json \
            --target-platform android-arm,android-arm64

          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p "$RUNNER_TEMP/apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/apk/cca-frontend-${VERSION}.apk"

          jq -n \
            --arg v "$VERSION" \
            --arg env "${{ needs.prepare.outputs.environment }}" \
            --arg region "${{ needs.prepare.outputs.region }}" \
            --arg flutter_sha "$(git rev-parse HEAD)" \
            --arg api "http://travel-planner.ddns.net:${{ needs.prepare.outputs.backend_port }}" \
            '{deployment:$v, environment:$env, region:$region, flutter:$flutter_sha, api:$api}' \
            > "$RUNNER_TEMP/apk/source-version-${VERSION}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/apk/*
          retention-days: 30

  deploy-terraform:
    needs: [prepare, build-backend, build-admin]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      (needs.prepare.outputs.action == 'rollback' || (needs.build-backend.result == 'success' && needs.build-admin.result == 'success'))
    runs-on: [self-hosted, linux]
    environment: ${{ needs.prepare.outputs.environment }}
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      ACTION: ${{ needs.prepare.outputs.action }}
      ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      NAMESPACE: ${{ needs.prepare.outputs.namespace }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BACKEND_IMAGE: ${{ needs.prepare.outputs.backend_image }}
      ADMIN_IMAGE: ${{ needs.prepare.outputs.admin_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rotate .current -> .previous (deploy only)
        if: needs.prepare.outputs.action == 'deploy'
        run: |
          set -euo pipefail
          mkdir -p /srv/cca/releases
          current_file="/srv/cca/releases/${ENVIRONMENT}.current"
          if [[ -f "$current_file" ]]; then
            cp "$current_file" "/srv/cca/releases/${ENVIRONMENT}.previous"
          fi

      - name: Backup Terraform state
        run: ./scripts/backup-state.sh "$ENVIRONMENT"

      - name: Apply secrets
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MONGO_ADMIN_PASSWORD: ${{ secrets.MONGO_ADMIN_PASSWORD }}
        run: ./scripts/apply-secrets.sh "$ENVIRONMENT"

      - name: Terraform apply
        run: |
          set -euo pipefail
          export TF_DATA_DIR="/srv/cca/tfdata/${ENVIRONMENT}"
          terraform -chdir=terraform/app init -reconfigure -lock-timeout=5m \
            -backend-config="path=/srv/cca/state/${ENVIRONMENT}/terraform.tfstate"
          terraform -chdir=terraform/app apply -auto-approve -lock-timeout=5m \
            -var-file="../../config/${ENVIRONMENT}.tfvars" \
            -var="deployment_version=${VERSION}" \
            -var="backend_image=${BACKEND_IMAGE}" \
            -var="admin_image=${ADMIN_IMAGE}"

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deploy/backend --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deploy/backend-cron --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deploy/admin-frontend --timeout=5m

      - name: Record manifest (deploy only)
        if: needs.prepare.outputs.action == 'deploy'
        env:
          REGION: ${{ needs.prepare.outputs.region }}
        run: |
          set -euo pipefail
          mkdir -p "/srv/cca/releases/${VERSION}"
          jq -n \
            --arg v "$VERSION" \
            --arg env "$ENVIRONMENT" \
            --arg region "$REGION" \
            --arg backend "$BACKEND_IMAGE" \
            --arg admin "$ADMIN_IMAGE" \
            '{deployment:$v, environment:$env, region:$region, backend_image:$backend, admin_image:$admin}' \
            > "/srv/cca/releases/${VERSION}/manifest.json"

      - name: Health check (circuit breaker on failure)
        run: ./scripts/health-check.sh "$ENVIRONMENT" "${{ needs.prepare.outputs.backend_port }}" "${{ needs.prepare.outputs.admin_port }}" "$VERSION"

      - name: Tag this version in git (deploy only)
        if: needs.prepare.outputs.action == 'deploy'
        env:
          REGION: ${{ needs.prepare.outputs.region }}
        run: |
          set -euo pipefail
          git config user.email "brguru90@gmail.com"
          git config user.name "brguru90"
          git tag -a "$VERSION" -m "Deployment ${VERSION}

          region: ${REGION}
          environment: ${ENVIRONMENT}
          backend:  ${BACKEND_IMAGE}
          admin:    ${ADMIN_IMAGE}"
          git push origin "$VERSION"

  record-release:
    needs: [prepare, deploy-terraform, build-flutter]
    if: |
      always() &&
      needs.prepare.outputs.action == 'deploy' &&
      needs.deploy-terraform.result == 'success'
    runs-on: [self-hosted, linux]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download APK artifact (if the Flutter job ran and succeeded)
        if: needs.build-flutter.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk-${{ env.VERSION }}
          path: ${{ runner.temp }}/release-${{ env.VERSION }}

      - name: Create GitHub Release with whatever assets exist
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          REGION: ${{ needs.prepare.outputs.region }}
        run: |
          set -euo pipefail
          manifest="/srv/cca/releases/${VERSION}/manifest.json"
          assets=()
          if [[ -f "$manifest" ]]; then
            assets+=("$manifest")
          fi

          apk_dir="${{ runner.temp }}/release-${VERSION}"
          if [[ -d "$apk_dir" ]]; then
            assets+=("$apk_dir"/*)
          else
            echo "::notice::No Flutter APK for ${VERSION} (skip_flutter was set, or that job failed/was skipped) - the release will only contain the deployment manifest."
          fi

          # deploy-terraform's prior step already created and pushed this
          # exact tag - gh release create attaches to it rather than
          # creating a new one, since the tag already exists.
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes "Deployment ${VERSION} (environment: ${ENVIRONMENT}, region: ${REGION})" \
            "${assets[@]}"
