# One-time (idempotent) host bootstrap, run via the self-hosted runner
# instead of SSH'ing into the server by hand. Runs scripts/install-k3s.sh
# and scripts/bootstrap-server.sh - see docs/RUNBOOK.md Sec 2 for what each
# does. Manual dispatch only; re-running later is safe (both scripts are
# written to be idempotent) if you ever need to re-verify host state.
#
# REQUIRES passwordless sudo for the runner's OS user, scoped to these two
# scripts - see docs/RUNBOOK.md for the exact sudoers line. This is the one
# piece that can't be automated further: granting that access is itself a
# security decision only you can make on the actual host, and GitHub Actions
# has no way to supply an interactive sudo password.
#
# IMPORTANT - READ THIS BEFORE RUNNING CCA PLATFORM/DEPLOY AFTERWARDS:
# bootstrap-server.sh adds the runner's OS user to the `cca` group so it can
# read /etc/rancher/k3s/k3s.yaml, but a process's group memberships are fixed
# at login/start time. The runner process that executes THIS job is already
# running and won't pick up the new group membership - every OTHER workflow
# in this repo reads the kubeconfig directly (no sudo), so you MUST restart
# the runner service after this job succeeds, before triggering CCA
# Platform or CCA Deploy, or they'll fail to read the kubeconfig.

name: CCA Bootstrap Host

on:
  workflow_dispatch:
    inputs:
      runner_user:
        description: OS user the self-hosted runner service runs as (passed to bootstrap-server.sh as RUNNER_USER)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure terraform and helm are installed (idempotent)
        # bootstrap-server.sh only verifies these are present - it
        # deliberately doesn't install anything, since it also has to work
        # for the manual SSH path where auto-installing tools behind the
        # user's back would be a surprise. This step is specific to the
        # fully-automated runner path, and assumes the runner service itself
        # runs as root (no `sudo` prefix here - apt-get/wget/curl need root,
        # and unlike the two scripts below, these raw commands can't be
        # scoped cleanly via a sudoers path rule). If your runner runs as a
        # non-root user with only the scoped sudoers entry from
        # docs/RUNBOOK.md, install terraform/helm by hand instead and this
        # step becomes a no-op.
        run: |
          set -euo pipefail
          if ! command -v terraform >/dev/null 2>&1; then
            echo "Installing terraform..."
            wget -qO- https://apt.releases.hashicorp.com/gpg | gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" > /etc/apt/sources.list.d/hashicorp.list
            apt-get update -y
            apt-get install -y terraform
          fi
          if ! command -v helm >/dev/null 2>&1; then
            echo "Installing helm..."
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          if ! command -v gh >/dev/null 2>&1; then
            # NOT gpg --dearmor here (unlike terraform's key above) - GitHub
            # ships this keyring already in binary format, per the official
            # install instructions (cli.github.com/packages/...). Dearmoring
            # an already-binary file corrupts it.
            echo "Installing gh (GitHub CLI) - deploy.yml's record-release job needs it..."
            wget -qO /usr/share/keyrings/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
            apt-get update -y
            apt-get install -y gh
          fi
          terraform version
          helm version
          gh version

      - name: Install Android SDK (idempotent) - build-flutter needs it for `flutter build apk`
        # cca_frontend/android/app/build.gradle uses Flutter's own default
        # compileSdkVersion (33 for Flutter 3.7.12) and AGP 7.2.0
        # (android/build.gradle). Only platform-tools + platforms;android-33
        # + one build-tools version are pre-installed here - AGP downloads
        # any other exact SDK component it needs on its own during the
        # actual Gradle build, as long as sdkmanager exists, ANDROID_SDK_ROOT
        # is set (see deploy.yml's build-flutter job env), and licenses are
        # already accepted (the `yes |` below, non-interactively, since a
        # real license prompt would hang forever in CI).
        run: |
          set -euo pipefail
          # `|| true`: this host has an unrelated third-party apt source
          # (packagecloud.io/ookla/speedtest-cli) that 404s on its Release
          # file - apt-get update fails hard on ANY configured repo being
          # broken, even one nothing here uses. Tolerating that failure and
          # letting the actual `apt-get install` calls below be the real
          # gate (they still fail loudly if unzip/java genuinely can't be
          # found in Ubuntu's own archives) is more robust than this step
          # breaking every time an unrelated PPA on the host has a bad day.
          if ! command -v unzip >/dev/null 2>&1; then
            apt-get update -y || true
            apt-get install -y unzip
          fi
          if ! command -v java >/dev/null 2>&1; then
            # sdkmanager itself just needs *a* working JRE to run - this is
            # independent of the specific JDK (Temurin 11) that
            # actions/setup-java provides per-job for the actual Gradle/AGP
            # build in deploy.yml's build-flutter job.
            apt-get update -y || true
            apt-get install -y default-jre-headless
          fi
          sdk_root=/opt/android-sdk
          if [[ ! -d "${sdk_root}/cmdline-tools/latest" ]]; then
            echo "Installing Android cmdline-tools..."
            mkdir -p "${sdk_root}/cmdline-tools"
            tmp_zip="$(mktemp)"
            curl -fsSL -o "$tmp_zip" "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
            unzip -q "$tmp_zip" -d "${sdk_root}/cmdline-tools"
            # The zip's own top-level dir is "cmdline-tools" - sdkmanager
            # expects to live under .../cmdline-tools/<some-name>/bin, so
            # this becomes .../cmdline-tools/latest/bin as its docs require.
            mv "${sdk_root}/cmdline-tools/cmdline-tools" "${sdk_root}/cmdline-tools/latest"
            rm -f "$tmp_zip"
          fi
          export ANDROID_SDK_ROOT="$sdk_root"
          yes | "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2"
          chmod -R a+rX "$sdk_root"
          "${sdk_root}/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install K3s (idempotent - no-ops if already installed)
        run: sudo ./scripts/install-k3s.sh

      - name: Bootstrap /srv/cca layout and runner group membership
        run: sudo RUNNER_USER="${{ inputs.runner_user }}" ./scripts/bootstrap-server.sh

      - name: Verify cluster is up
        # `sudo` here deliberately, not the group-based read every other
        # workflow uses - this job's own process can't have the `cca` group
        # membership the previous step just granted (see header comment), so
        # this is the only way to confirm cluster health within this same run.
        run: sudo kubectl get nodes -o wide

      - name: Next steps
        run: |
          echo "::notice title=Restart the runner now::K3s and host bootstrap succeeded. Before running CCA Platform or CCA Deploy, restart the self-hosted runner service (e.g. 'sudo systemctl restart actions.runner.*', or that service's own stop/start command) so it picks up its new 'cca' group membership - otherwise those workflows will fail to read /etc/rancher/k3s/k3s.yaml."
